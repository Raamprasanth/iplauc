<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auction Arena — Simulation Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared_auction.css">
    <style>
        .sim-workspace {
            display: flex;
            height: calc(100vh - 60px);
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        .sim-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .panel-header {
            padding: 15px 20px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border2);
            font-family: 'Bebas Neue';
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sim-left {
            flex: 1;
            min-width: 350px;
        }

        .sim-center {
            flex: 2;
            min-width: 500px;
        }

        /* Tabs */
        .sim-tabs {
            display: flex;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }
        .sim-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: #aaa;
            font-family: 'Rajdhani';
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
        }
        .sim-tab:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .sim-tab.active {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
            background: rgba(255, 215, 0, 0.05);
        }

        /* Tables */
        .pts-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Rajdhani';
            font-weight: 600;
            font-size: 15px;
        }
        .pts-table th {
            background: rgba(0,0,0,0.3);
            color: var(--cyan);
            padding: 12px 10px;
            text-align: center;
        }
        .pts-table th:first-child { text-align: left; }
        .pts-table td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border2);
        }
        .pts-table td:first-child { text-align: left; }
        .pts-table tr:hover td { background: rgba(255,255,255,0.02); }

        /* Fixtures */
        .fixture-list { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .fixture-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .fixture-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        .fix-team { font-family: 'Bebas Neue'; font-size: 22px; width: 80px; text-align: center; }
        .fix-vs { color: var(--gold); font-size: 12px; font-weight: bold; }
        .fix-btn {
            background: var(--gold); color: #000; border: none; padding: 6px 15px;
            border-radius: 4px; font-family: 'Bebas Neue'; font-size: 16px; cursor: pointer;
        }
        .fix-btn:disabled { background: var(--border); color: #888; cursor: not-allowed; }

        /* Arena */
        .arena-wrap { padding: 20px; display: flex; flex-direction: column; height: 100%; align-items: center; justify-content: center; }
        .scoreboard {
            width: 100%; max-width: 600px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .sb-header {
            background: linear-gradient(90deg, #111, #222); padding: 10px;
            text-align: center; font-family: 'Bebas Neue'; font-size: 20px;
            border-bottom: 1px solid var(--border2);
            color: var(--cyan);
        }
        .sb-teams { display: flex; align-items: stretch; }
        .sb-team {
            flex: 1; padding: 20px; text-align: center;
        }
        .sb-team:first-child { border-right: 1px solid var(--border2); }
        .sb-team-name { font-family: 'Bebas Neue'; font-size: 36px; margin-bottom: 10px; }
        .sb-score { font-family: 'Exo 2'; font-size: 48px; font-weight: 800; color: #fff; }
        .sb-overs { font-family: 'Rajdhani'; font-size: 16px; color: #aaa; font-weight: 600;}

        .sb-footer {
            background: var(--surface2); padding: 12px; text-align: center;
            font-family: 'Rajdhani'; font-size: 16px; font-weight: 700; color: var(--gold);
        }

        /* Controls */
        .arena-controls { margin-top: 30px; display: flex; gap: 15px; align-items: center; }
        .speed-sel {
            background: var(--surface2); color: #fff; border: 1px solid var(--border);
            padding: 10px; border-radius: 6px; font-family: 'Rajdhani'; font-weight: 600; font-size: 16px;
        }
        .play-btn {
            background: var(--cyan); color: #000; border: none; padding: 10px 30px;
            border-radius: 6px; font-family: 'Bebas Neue'; font-size: 24px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0,212,255,0.4);
            transition: 0.2s;
        }
        .play-btn:hover { box-shadow: 0 0 25px rgba(0,212,255,0.6); transform: scale(1.05); }
        .play-btn:disabled { background: var(--border); color: #888; box-shadow: none; transform: none; cursor: not-allowed; }

    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="confetti-wrap" id="cfWrap"></div>

    <header class="header">
        <div class="brand"><span class="brand-icon">⚡</span>DYNASTY MODE</div>
        <div class="header-pills">
            <div class="pill" style="border-color: var(--cyan); background: rgba(0,212,255,0.1);">ROOM <span class="pv" id="hRoomCode" style="color: var(--cyan); font-weight: 800; font-size: 16px; letter-spacing: 2px;">---</span></div>
            <div class="pill" style="border-color: var(--gold);">SEASON <span class="pv" id="hSeason" style="color: var(--gold);">1</span></div>
        </div>
    </header>

    <div class="sim-workspace">
        
        <!-- LEFT PANEL: Standings -->
        <div class="sim-panel sim-left">
            <div class="panel-header">
                <div>🏆 POINTS TABLE</div>
            </div>
            <div style="flex:1; overflow-y:auto; padding: 10px;">
                <table class="pts-table" id="ptsTable">
                    <thead>
                        <tr>
                            <th>TEAM</th>
                            <th>P</th>
                            <th>W</th>
                            <th>L</th>
                            <th>PTS</th>
                        </tr>
                    </thead>
                    <tbody id="ptsBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
            <div style="padding: 15px; text-align: center; border-top: 1px solid var(--border2);">
                <button class="play-btn" style="width: 100%; font-size: 18px; padding: 8px; background: var(--green);" id="btnEndSeason" onclick="endSeason()" disabled>END SEASON & PROCEED TO RETENTIONS</button>
            </div>
        </div>

        <!-- CENTER PANEL: Matches & Arena -->
        <div class="sim-panel sim-center">
            
            <div class="sim-tabs">
                <button class="sim-tab active" onclick="switchTab('fixtures', this)">📅 FIXTURES</button>
                <button class="sim-tab" onclick="switchTab('arena', this)">🏟️ MATCH ARENA</button>
            </div>

            <!-- FIXTURES TAB -->
            <div id="tab-fixtures" class="fixture-list">
                <div style="text-align:center; margin-top:20px;">
                    <button class="play-btn" id="btnGenSchedule" onclick="generateSchedule()">GENERATE SEASON SCHEDULE</button>
                </div>
            </div>

            <!-- ARENA TAB -->
            <div id="tab-arena" class="arena-wrap" style="display:none;">
                <h2 id="arenaMatchTitle" style="font-family:'Bebas Neue'; color:var(--cyan); letter-spacing:2px; margin-bottom: 20px;">NO MATCH SELECTED</h2>
                
                <div class="scoreboard">
                    <div class="sb-header" id="sbHeader">MATCH STATUS: PENDING</div>
                    <div class="sb-teams">
                        <div class="sb-team">
                            <div class="sb-team-name" id="sbT1Name" style="color: #FF3D5A">TEAM A</div>
                            <div class="sb-score" id="sbT1Score">0/0</div>
                            <div class="sb-overs" id="sbT1Overs">0.0 OVERS</div>
                        </div>
                        <div class="sb-team">
                            <div class="sb-team-name" id="sbT2Name" style="color: #00D4FF">TEAM B</div>
                            <div class="sb-score" id="sbT2Score">0/0</div>
                            <div class="sb-overs" id="sbT2Overs">0.0 OVERS</div>
                        </div>
                    </div>
                    <div class="sb-footer" id="sbFooter">READY TO PLAY</div>
                </div>

                <div class="arena-controls">
                    <select class="speed-sel" id="simSpeed">
                        <option value="INSTANT">⚡ Instant Result</option>
                        <option value="OVER">🏏 Over-by-Over</option>
                        <option value="BALL">🎾 Ball-by-Ball</option>
                    </select>
                    <button class="play-btn" id="btnSimulate" onclick="simulateMatch()" disabled>PLAY MATCH ▶</button>
                </div>
            </div>

        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        let roomCode = new URLSearchParams(window.location.search).get('room');
        let lobbyData = null;
        let activeMatch = null;

        // Toast Helper
        function showToast(msg, type='info') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.className = 'toast', 3000);
        }

        // Init
        async function loadState() {
            if (!roomCode) {
                const session = JSON.parse(sessionStorage.getItem('ipl_session') || '{}');
                roomCode = session.roomCode;
            }
            if (!roomCode) return;

            document.getElementById('hRoomCode').textContent = roomCode;

            try {
                const res = await fetch(`${API}/lobby/room/${roomCode}`);
                const json = await res.json();
                if (json.success) {
                    lobbyData = json.data;
                    document.getElementById('hSeason').textContent = lobbyData.currentSeason || 1;
                    renderState();
                }
            } catch (err) {
                showToast('Failed to load state', 'error');
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.sim-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-fixtures').style.display = tabId === 'fixtures' ? 'flex' : 'none';
            document.getElementById('tab-arena').style.display = tabId === 'arena' ? 'flex' : 'none';
        }

        async function generateSchedule() {
            try {
                const res = await fetch(`${API}/sim/${roomCode}/generate-schedule`, { method: 'POST' });
                const json = await res.json();
                if (json.success) {
                    showToast('Schedule Generated!', 'success');
                    await loadState(); // reload to get new schedule
                } else {
                    showToast(json.message, 'error');
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function renderState() {
            if (!lobbyData) return;
            const season = lobbyData.seasons.find(s => s.seasonNumber === (lobbyData.currentSeason || 1));
            
            const tabFixtures = document.getElementById('tab-fixtures');
            if (!season || !season.schedule || season.schedule.length === 0) {
                tabFixtures.innerHTML = `
                    <div style="text-align:center; margin-top:50px;">
                        <h3 style="color:var(--gold); font-family:'Bebas Neue'; font-size:32px;">NO SCHEDULE YET</h3>
                        <p style="color:#aaa;">Generate a round-robin schedule for all teams in the lobby.</p>
                        <br>
                        <button class="play-btn" onclick="generateSchedule()">GENERATE SEASON ${lobbyData.currentSeason || 1} SCHEDULE</button>
                    </div>`;
                return;
            }

            // Render Standings
            const ptsBody = document.getElementById('ptsBody');
            let standings = [...season.standings];
            standings.sort((a, b) => b.points - a.points || b.nrr - a.nrr);
            
            ptsBody.innerHTML = standings.map(s => {
                const t = lobbyData.teams.find(tm => tm.localId === s.teamLocalId);
                return `
                    <tr>
                        <td style="color:${t?t.color:'#fff'}">${t?t.name:s.teamLocalId}</td>
                        <td>${s.played}</td>
                        <td>${s.won}</td>
                        <td>${s.lost}</td>
                        <td style="color:var(--gold); font-weight:800">${s.points}</td>
                    </tr>
                `;
            }).join('');

            // Render Schedule
            let allPlayed = true;
            tabFixtures.innerHTML = season.schedule.map((m, idx) => {
                const t1 = lobbyData.teams.find(tm => tm.localId === m.team1);
                const t2 = lobbyData.teams.find(tm => tm.localId === m.team2);
                if (m.status !== 'PLAYED') allPlayed = false;
                
                return `
                    <div class="fixture-card">
                        <div style="display:flex; align-items:center; gap:15px;">
                            <div style="color:#888; font-weight:bold; font-size:12px;">MATCH ${idx+1}</div>
                            <div class="fix-team" style="color:${t1?t1.color:'#fff'}">${t1?t1.name:m.team1}</div>
                            <div class="fix-vs">VS</div>
                            <div class="fix-team" style="color:${t2?t2.color:'#fff'}">${t2?t2.name:m.team2}</div>
                        </div>
                        <div>
                            ${m.status === 'PLAYED' 
                                ? `<span style="color:var(--green); font-weight:bold; font-size:14px;">${m.summary}</span>` 
                                : `<button class="fix-btn" onclick="setupMatch('${m.matchId}')">SELECT</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');

            if (allPlayed && season.schedule.length > 0) {
                document.getElementById('btnEndSeason').disabled = false;
            }
        }

        function setupMatch(matchId) {
            const season = lobbyData.seasons.find(s => s.seasonNumber === (lobbyData.currentSeason || 1));
            activeMatch = season.schedule.find(m => m.matchId === matchId);
            
            const t1 = lobbyData.teams.find(tm => tm.localId === activeMatch.team1);
            const t2 = lobbyData.teams.find(tm => tm.localId === activeMatch.team2);

            document.getElementById('arenaMatchTitle').textContent = `MATCH: ${t1.name} VS ${t2.name}`;
            document.getElementById('sbT1Name').textContent = t1.name;
            document.getElementById('sbT1Name').style.color = t1.color;
            document.getElementById('sbT2Name').textContent = t2.name;
            document.getElementById('sbT2Name').style.color = t2.color;

            document.getElementById('sbT1Score').textContent = '0/0';
            document.getElementById('sbT1Overs').textContent = '0.0 OVERS';
            document.getElementById('sbT2Score').textContent = '0/0';
            document.getElementById('sbT2Overs').textContent = '0.0 OVERS';
            document.getElementById('sbFooter').textContent = 'READY TO PLAY';
            document.getElementById('sbHeader').textContent = 'MATCH STATUS: PENDING';
            
            document.getElementById('btnSimulate').disabled = false;

            // Switch to Arena Tab
            switchTab('arena', document.querySelectorAll('.sim-tab')[1]);
        }

        // --- SIMULATION ENGINE ---
        let simInterval = null;
        
        async function simulateMatch() {
            if (!activeMatch) return;
            
            document.getElementById('btnSimulate').disabled = true;
            document.getElementById('sbHeader').textContent = 'MATCH STATUS: LIVE';
            
            const speed = document.getElementById('simSpeed').value;
            
            // Simple probability simulation (randomized T20 logic)
            // In a real app, this would use player stats. 
            // For now, we simulate realistically randomized innings.
            
            const t1Score = generateInnings();
            const t2Score = generateInnings(t1Score.runs); // chase

            if (speed === 'INSTANT') {
                renderFinalScore(t1Score, t2Score);
                await saveMatchResult(t1Score, t2Score);
            } else {
                // Animate Over-by-Over or Ball-by-Ball
                animateInnings(t1Score, t2Score, speed);
            }
        }

        function generateInnings(target = 999) {
            let runs = 0, wkts = 0, balls = 0;
            for (let i = 0; i < 120; i++) {
                if (wkts >= 10 || runs > target) break;
                balls++;
                const r = Math.random();
                if (r < 0.05) wkts++; // 5% chance of wicket per ball
                else if (r < 0.2) runs += 0; // dot ball
                else if (r < 0.5) runs += 1;
                else if (r < 0.65) runs += 2;
                else if (r < 0.8) runs += 4; // boundary
                else if (r < 0.9) runs += 6; // six
                else runs += 1; // extras etc
            }
            return { runs, wkts, overs: Math.floor(balls/6) + '.' + (balls%6), isChase: target !== 999 };
        }

        function renderFinalScore(s1, s2) {
            document.getElementById('sbT1Score').textContent = `${s1.runs}/${s1.wkts}`;
            document.getElementById('sbT1Overs').textContent = `${s1.overs} OVERS`;
            document.getElementById('sbT2Score').textContent = `${s2.runs}/${s2.wkts}`;
            document.getElementById('sbT2Overs').textContent = `${s2.overs} OVERS`;

            let summary = '';
            let winnerId = null;
            if (s1.runs > s2.runs) {
                summary = `${document.getElementById('sbT1Name').textContent} WON BY ${s1.runs - s2.runs} RUNS`;
                winnerId = activeMatch.team1;
            } else if (s2.runs > s1.runs) {
                summary = `${document.getElementById('sbT2Name').textContent} WON BY ${10 - s2.wkts} WICKETS`;
                winnerId = activeMatch.team2;
            } else {
                summary = 'MATCH TIED';
                winnerId = 'TIE';
            }
            
            document.getElementById('sbHeader').textContent = 'MATCH STATUS: COMPLETED';
            document.getElementById('sbFooter').textContent = summary;
            return { winnerId, summary };
        }

        async function saveMatchResult(s1, s2) {
            const { winnerId, summary } = renderFinalScore(s1, s2);
            
            try {
                const res = await fetch(`${API}/sim/${roomCode}/update-match`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        seasonNumber: lobbyData.currentSeason || 1,
                        matchId: activeMatch.matchId,
                        winnerTeamId: winnerId,
                        score1: `${s1.runs}/${s1.wkts} (${s1.overs})`,
                        score2: `${s2.runs}/${s2.wkts} (${s2.overs})`,
                        summary: summary
                    })
                });
                const json = await res.json();
                if (json.success) {
                    showToast('Match Saved!', 'success');
                    activeMatch = null;
                    await loadState(); // Update standings
                }
            } catch (err) {
                showToast('Failed to save match', 'error');
            }
        }

        function animateInnings(s1, s2, speed) {
            let delay = speed === 'BALL' ? 50 : 200; // ms per tick
            // To be implemented: A nice UI counter that ticks up to the target score
            // For now, we simulate instantly after a short timeout to prove concept.
            document.getElementById('sbFooter').textContent = 'SIMULATING INNINGS...';
            setTimeout(() => {
                renderFinalScore(s1, s2);
                saveMatchResult(s1, s2);
            }, 1500);
        }

        function endSeason() {
            showToast('Advancing to Off-Season (Retentions & Trades)...', 'info');
            // This will call an API in Phase 2 to move to OFFSEASON status.
            setTimeout(() => {
                window.location.href = `offseason.html?room=${roomCode}`;
            }, 2000);
        }

        window.onload = loadState;
    </script>
</body>
</html>
